name: Expand RC12 source bootstrap

on:
  push:
    branches:
      - publish-rc12

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.b64.* | base64 -d > /tmp/acer-control-source.tar.gz
          tar -xzf /tmp/acer-control-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Acer Control 0.1.0-rc12 source tree"
          git push origin HEAD:publish-rc12

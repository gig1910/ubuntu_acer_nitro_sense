name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.tar.gz'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.tar.gz
          tar -xzf .bootstrap/source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish Acer Control 0.1.0-rc12 source tree'
          git push origin HEAD:main
